<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Questionnaire: Diet &amp; Lifestyle Habits</title>
<!-- Google Fonts: Manrope -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Config Customization -->
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              emerald: '#0B6B57',
              dark: '#17201D',
              muted: '#68736F',
              bg: '#FCFCFA',
              border: '#E4E9E6',
              surface: '#F5F7F6',
              mint: '#EBF5F1'
            }
          },
          fontFamily: {
            sans: ['Manrope', 'sans-serif'],
          }
        }
      }
    }
  </script>
<!-- BEGIN: Custom Styles -->
<style data-purpose="base-styling">
    body {
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #FCFCFA;
      color: #17201D;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
<!-- END: Custom Styles -->
</head>
<body class="bg-[#FCFCFA] min-h-screen flex justify-center selection:bg-[#0B6B57]/10">
<!-- Mobile Viewport Container (iOS 390px scale) -->
<div class="w-full max-w-[390px] min-h-screen flex flex-col justify-between relative bg-[#FCFCFA] antialiased">
<!-- BEGIN: HeaderSection -->
<header class="pt-4 pb-2 px-5 sticky top-0 bg-[#FCFCFA]/95 backdrop-blur-sm z-20" data-purpose="screen-navigation-header">
<div class="flex items-center justify-between gap-4">
<!-- Back Navigation Button -->
<button aria-label="Go Back" class="w-10 h-10 -ml-2 rounded-full flex items-center justify-center text-[#17201D] hover:bg-[#E4E9E6]/40 active:scale-95 transition-all" type="button">
<svg class="w-6 h-6 stroke-[2.2]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- Segmented Progress Bar (7 of 18 ≈ 38.8%) -->
<div aria-valuemax="18" aria-valuemin="1" aria-valuenow="7" class="flex-1 max-w-[190px] h-1.5 bg-[#E4E9E6] rounded-full overflow-hidden" role="progressbar">
<div class="h-full bg-[#0B6B57] rounded-full" style="width: 38.8%;"></div>
</div>
<!-- Progress Counter -->
<span class="text-xs font-semibold text-[#68736F] whitespace-nowrap min-w-[42px] text-right">
          7 of 18
        </span>
</div>
</header>
<!-- END: HeaderSection -->
<!-- BEGIN: MainContent -->
<main class="flex-1 flex flex-col justify-start pb-6">
<!-- Section Title & Meta -->
<section class="mt-6 px-5" data-purpose="heading-section">
<span class="text-[12px] font-bold text-[#68736F] tracking-[1px] uppercase block">
          PHYSICAL &amp; LIFESTYLE
        </span>
<h1 class="text-[24px] font-bold text-[#17201D] leading-tight mt-2">
          What are your lifestyle habits?
        </h1>
<p class="text-[14px] text-[#68736F] leading-relaxed mt-2 font-normal">
          Helps connect with matches who share compatible daily practices and values.
        </p>
</section>
<!-- Questionnaire Form Controls -->
<section class="mt-8 flex flex-col" data-purpose="form-controls">
<!-- Control 1: Dietary Habits Dropdown -->
<div class="px-5">
<label class="block text-[13px] font-bold text-[#17201D] mb-3" for="diet-selector">
            Dietary Habits
          </label>
<button aria-expanded="false" class="w-full h-14 bg-white border border-[#E4E9E6] rounded-[14px] px-4 flex items-center justify-between shadow-sm active:border-[#0B6B57] transition-all" id="diet-selector" role="combobox" type="button">
<div class="flex items-center gap-3">
<!-- Food & Dining Cutlery Icon -->
<span class="text-[#68736F] flex items-center justify-center w-5 h-5">
<svg class="w-5 h-5 stroke-[1.8]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M12 6v6m0 0v6m0-6h6m-6 0H6" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="M18.364 5.636a9 9 0 010 12.728M5.636 5.636a9 9 0 000 12.728" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</span>
<span class="text-[16px] font-medium text-[#17201D]">Non-Vegetarian</span>
</div>
<!-- Chevron Down Icon -->
<svg class="w-5 h-5 text-[#68736F] stroke-[2]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M19.5 8.25l-7.5 7.5-7.5-7.5" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
<!-- Control 2: Smoking Habits Pill Selector -->
<div class="mt-7 px-5">
<span class="block text-[13px] font-bold text-[#17201D] mb-3">
            Smoking
          </span>
<div class="flex items-center gap-3 flex-wrap">
<!-- Selected State -->
<button class="h-10 px-5 rounded-full bg-[#0B6B57] text-white text-[14px] font-semibold flex items-center justify-center shadow-sm" type="button">
              Never
            </button>
<!-- Unselected State -->
<button class="h-10 px-5 rounded-full bg-white border border-[#E4E9E6] text-[#17201D] text-[14px] font-medium flex items-center justify-center hover:bg-slate-50 transition-colors" type="button">
              Socially
            </button>
<!-- Unselected State -->
<button class="h-10 px-5 rounded-full bg-white border border-[#E4E9E6] text-[#17201D] text-[14px] font-medium flex items-center justify-center hover:bg-slate-50 transition-colors" type="button">
              Regularly
            </button>
</div>
</div>
<!-- Control 3: Drinking Habits Pill Selector -->
<div class="mt-7 px-5">
<span class="block text-[13px] font-bold text-[#17201D] mb-3">
            Drinking
          </span>
<div class="flex items-center gap-3 flex-wrap">
<!-- Selected State -->
<button class="h-10 px-5 rounded-full bg-[#0B6B57] text-white text-[14px] font-semibold flex items-center justify-center shadow-sm" type="button">
              Never
            </button>
<!-- Unselected State -->
<button class="h-10 px-5 rounded-full bg-white border border-[#E4E9E6] text-[#17201D] text-[14px] font-medium flex items-center justify-center hover:bg-slate-50 transition-colors" type="button">
              Socially
            </button>
<!-- Unselected State -->
<button class="h-10 px-5 rounded-full bg-white border border-[#E4E9E6] text-[#17201D] text-[14px] font-medium flex items-center justify-center hover:bg-slate-50 transition-colors" type="button">
              Regularly
            </button>
</div>
</div>
<!-- Reassurance Banner -->
<div class="mt-8 px-5">
<div class="bg-[#F5F7F6] rounded-[14px] p-4 flex items-start gap-3.5 border border-[#E4E9E6]/60">
<!-- Serene Shield Icon -->
<div class="w-7 h-7 rounded-full bg-[#EBF5F1] text-[#0B6B57] flex-shrink-0 flex items-center justify-center mt-0.5">
<svg class="w-4 h-4 stroke-[2]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<p class="text-[13px] text-[#68736F] leading-snug font-normal">
              Habits are shared respectfully to help find genuine lifestyle compatibility.
            </p>
</div>
</div>
</section>
</main>
<!-- END: MainContent -->
<!-- BEGIN: FooterAction -->
<footer class="p-5 pt-2 pb-6 bg-[#FCFCFA]" data-purpose="bottom-action-container">
<button class="w-full h-[52px] bg-[#0B6B57] hover:bg-[#095746] active:bg-[#074739] text-white rounded-[14px] font-bold text-[16px] flex items-center justify-center gap-2 shadow-sm transition-all focus:outline-none" type="button">
<span>Continue</span>
<!-- Right Arrow Icon -->
<svg class="w-5 h-5 stroke-[2.2]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</footer>
<!-- END: FooterAction -->
</div>
</body></html>
