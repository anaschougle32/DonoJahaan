    <h1 class="text-center font-bold tracking-tight text-[28px] leading-[34px] text-[#17201D] mt-[40px]" style="font-family: 'Manrope', 'Plus Jakarta Sans', sans-serif;">
      Meet With Purpose
    </h1>
    <!-- Subtext Typography: Manrope, 15px, Regular 400, #68736F, Line-height 1.5, px-[24px], mt-[16px] -->
    <p class="text-center font-normal text-[15px] leading-[1.5] text-[#68736F] px-[24px] mt-[16px] max-w-[340px]" style="font-family: 'Manrope', 'Plus Jakarta Sans', sans-serif;">
      Connect respectfully, involve family when you choose, and take one meaningful conversation at a time.
    </p>
  </div>

  <!-- Bottom Interactive Section: Pagination Dots + Primary Button -->
  <div class="w-full flex flex-col items-center">
    <!-- Pagination Dots: 40px above primary button (mb-[40px]), Dot 1 & 2 inactive circle 8x8 #E4E9E6, Dot 3 active pill 24x8 radius 999px #0B6B57 -->
    <div aria-label="Pagination" class="flex items-center justify-center space-x-2 mb-[40px]"><span class="w-[8px] h-[8px] rounded-full bg-[#E7DFF1] transition-all duration-300"></span>
      <span class="w-[8px] h-[8px] rounded-full bg-[#E7DFF1] transition-all duration-300"></span>
      <span class="w-[24px] h-[8px] rounded-[999px] bg-[#4A2E7A] transition-all duration-300"></span></div>
    <!-- Primary Button: Height 52px, Width 100% with 20px padding (px-5), #0B6B57, Text #FFFFFF, Font 15px SemiBold 600, rounded-[14px] -->
    <div class="w-full px-5">
      <button class="w-full h-[52px] rounded-[14px] bg-[#4A2E7A] text-[#FFFFFF] text-[15px] font-semibold flex items-center justify-center shadow-sm hover:bg-[#3B2462] active:scale-[0.985] transition-all cursor-pointer select-none" style="font-family: Manrope, &quot;Plus Jakarta Sans&quot;, sans-serif;" type="button">
