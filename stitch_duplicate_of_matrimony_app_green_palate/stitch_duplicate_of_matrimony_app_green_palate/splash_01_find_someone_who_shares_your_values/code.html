<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Splash 01 - Find Someone Who Shares Your Values</title>
<!-- Load Tailwind CSS v3 -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts for Plus Jakarta Sans / Inter -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              emerald: '#0B6B57',
              emeraldDark: '#085343',
              dark: '#141E1B',
              muted: '#66706D',
              cream: '#F4EFEA',
              cardBg: '#FCFCFB'
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif']
          },
          borderRadius: {
            '4xl': '36px'
          }
        }
      }
    };
  </script>
<style data-purpose="base-typography">
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background-color: #F3F1EC;
    }
  </style>
<style data-purpose="custom-shadows">
    .card-shadow {
      box-shadow: 0 10px 35px -5px rgba(20, 30, 27, 0.05), 0 0 1px 1px rgba(0, 0, 0, 0.03);
    }
    .btn-press:active {
      transform: scale(0.985);
      transition: transform 0.1s ease-in-out;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 sm:p-6 text-brand-dark">
<!-- BEGIN: ScreenLabel -->
<!-- Contextual label above the mock frame as shown in design screen mockups -->
<div class="w-full max-w-[375px] mb-3 px-2 flex justify-start text-xs font-medium text-[#8F9490] tracking-normal select-none" data-purpose="screen-indicator">
    Splash 01
  </div>
<!-- END: ScreenLabel -->
<!-- BEGIN: MainContainer -->
<main class="w-full max-w-[375px] h-[780px] bg-[#FAF8F5] rounded-[36px] card-shadow flex flex-col justify-between p-6 sm:p-7 relative overflow-hidden" data-purpose="mobile-card">
<!-- Top Empty Balance / Safe Area -->
<div aria-hidden="true" class="w-full pt-3"></div>
<!-- BEGIN: CenterContentSection -->
<section class="flex flex-col items-center w-full px-1" data-purpose="content-showcase">
<!-- BEGIN: VectorIllustration -->
<!-- Precise vector reproduction of Muslim family embracing their child -->
<div class="w-[260px] h-[240px] flex items-center justify-center mb-8 relative select-none" data-purpose="illustration-wrapper">
<svg class="w-full h-full drop-shadow-sm" fill="none" viewbox="0 0 300 280" xmlns="http://www.w3.org/2000/svg">
<!-- Background / Base husband robe (cream) -->
<path d="M72 170 C72 135, 102 110, 138 108 L170 145 C150 185, 115 220, 60 226 L72 170 Z" fill="#EFE8DE"></path>
<!-- Husband Head & Beard -->
<!-- Taqiyah cap -->
<ellipse cx="132" cy="74" fill="#0B6B57" rx="19" ry="12"></ellipse>
<!-- Head/Face skin -->
<path d="M120 78 C120 70, 144 70, 144 78 C144 88, 142 97, 132 99 C122 97, 120 88, 120 78 Z" fill="#FCECE1"></path>
<!-- Full dark beard & hair -->
<path d="M117 76 C117 96, 122 108, 132 108 C142 108, 147 96, 147 76 C147 88, 141 103, 132 103 C123 103, 117 88, 117 76 Z" fill="#1C2723"></path>
<!-- Beard body -->
<path d="M118 80 C116 88, 119 104, 132 104 C145 104, 148 88, 146 80 C144 94, 140 101, 132 101 C124 101, 120 94, 118 80 Z" fill="#1C2723"></path>
<!-- Wife Headscarf/Hijab (Deep Emerald) -->
<path d="M178 95 C178 78, 194 73, 210 84 C224 94, 238 120, 240 148 C240 170, 228 190, 212 196 C190 204, 172 188, 172 150 C172 125, 178 105, 178 95 Z" fill="#0B6B57"></path>
<!-- Wife Face opening & skin -->
<path d="M182 92 C186 86, 198 86, 202 93 C205 99, 204 109, 197 113 C189 116, 182 107, 182 92 Z" fill="#FCECE1"></path>
<!-- Wife Outer Body / Abaya (Warm Cream/Sand Base) -->
<path d="M170 140 C176 130, 222 142, 235 186 C242 210, 243 234, 243 238 L168 238 Z" fill="#EDE4D8"></path>
<!-- Wife Emerald Abaya Wrap -->
<path d="M176 138 C185 134, 215 136, 227 165 C237 190, 238 215, 220 224 C205 231, 185 220, 182 200 C178 184, 174 150, 176 138 Z" fill="#0B6B57"></path>
<!-- Combined Family Embrace (Husband arm / Emerald drape) -->
<path d="M96 160 C96 135, 140 135, 156 165 C162 176, 160 216, 132 225 C108 232, 96 200, 96 160 Z" fill="#0B6B57"></path>
<!-- Baby/Child in Center (Warm Cream Swaddle) -->
<circle cx="168" cy="188" fill="#FAF6EE" r="32"></circle>
<!-- Baby Head -->
<circle cx="168" cy="148" fill="#FCECE1" r="14"></circle>
<!-- Inner Child Figure / Toddler Silhouette in deep emerald -->
<ellipse cx="155" cy="198" fill="#073B30" rx="14" ry="17"></ellipse>
<circle cx="155" cy="172" fill="#073B30" r="10"></circle>
<!-- Delicate graceful embrace lines -->
<path d="M106 142 C104 165, 118 195, 132 208" fill="none" opacity="0.6" stroke="#06483B" stroke-linecap="round" stroke-width="1.8"></path>
<path d="M222 150 C215 174, 195 198, 172 204" fill="none" opacity="0.6" stroke="#074E3F" stroke-linecap="round" stroke-width="1.8"></path>
<path d="M172 202 C178 206, 188 206, 192 198" fill="none" stroke="#FCECE1" stroke-linecap="round" stroke-width="3"></path>
</svg>
</div>
<!-- END: VectorIllustration -->
<!-- BEGIN: TextContent -->
<!-- Primary heading -->
<h1 class="text-[26px] leading-[1.24] font-extrabold text-[#17201D] text-center tracking-[-0.02em] mb-3 px-2">
        Find Someone Who Shares Your Values
      </h1>
<!-- Secondary descriptive text -->
<p class="text-[14px] leading-[1.48] font-normal text-[#65716E] text-center max-w-[275px] mx-auto tracking-[-0.005em]">
        Discover Muslim profiles based on values, faith, family and life goals.
      </p>
<!-- END: TextContent -->
</section>
<!-- END: CenterContentSection -->
<!-- BEGIN: FooterActions -->
<footer class="w-full flex flex-col items-center pb-2" data-purpose="pagination-and-actions">
<!-- Carousel Pagination Dots -->
<nav aria-label="Onboarding Progress" class="flex items-center justify-center space-x-1.5 mb-7" data-purpose="carousel-indicator">
<!-- Active indicator (Pill) -->
<span aria-current="step" class="w-6 h-1.5 rounded-full bg-[#0B6B57] transition-all duration-300"></span>
<!-- Inactive dot 1 -->
<span class="w-1.5 h-1.5 rounded-full bg-[#BFC7C4]"></span>
<!-- Inactive dot 2 -->
<span class="w-1.5 h-1.5 rounded-full bg-[#BFC7C4]"></span>
</nav>
<!-- Primary Action Button -->
<button class="w-full h-[54px] rounded-[18px] bg-[#0B6B57] hover:bg-[#085545] active:bg-[#064437] text-white font-semibold text-[15px] flex items-center justify-center tracking-[-0.01em] shadow-[0_4px_16px_rgba(11,107,87,0.18)] transition-all duration-200 btn-press focus:outline-none focus:ring-2 focus:ring-[#0B6B57] focus:ring-offset-2" data-purpose="continue-button" type="button">
        Continue
      </button>
</footer>
<!-- END: FooterActions -->
</main>
<!-- END: MainContainer -->
</body></html>
